<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f7f8" />
    <title>Your ideas | Groundwork experiment</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23077ca8'/><path d='M6 21c7-4 11-4 20 2M6 16c7-4 11-4 20 2M6 11c7-4 11-4 20 2' fill='none' stroke='%23f5fbfc' stroke-width='2' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to ideas</a>

    <header class="topbar">
      <a class="brand" href="#" aria-label="Groundwork, return to Your ideas">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 21.5c3.8-2.2 6.9-3.3 10.1-3.3 4.1 0 6.7 1.5 11.9 5.5" />
          <path d="M5 16.4c3.8-2.2 6.9-3.3 10.1-3.3 4.1 0 6.7 1.5 11.9 5.5" />
          <path d="M5 11.3C8.8 9.1 11.9 8 15.1 8c4.1 0 6.7 1.5 11.9 5.5" />
        </svg>
        <span>Groundwork</span>
      </a>

      <nav class="account-actions" aria-label="Account">
        <button class="credits-button" type="button" data-notice="Credits page would open here">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" /></svg>
          <span><strong>28</strong> credits</span>
        </button>
        <button class="profile-button" type="button" aria-label="Open profile menu" data-notice="Profile menu would open here">
          <span class="avatar" aria-hidden="true">PS</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
        </button>
      </nav>
    </header>

    <main id="main-content" class="page-shell">
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Your ideas</h1>
          <p id="idea-summary">Seven ideas, two waiting for your decision.</p>
        </div>
        <button class="primary-button" id="new-idea-button" type="button" aria-expanded="false" aria-controls="new-idea-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          New idea
        </button>
      </section>

      <section class="new-idea-panel" id="new-idea-panel" aria-labelledby="new-idea-title" hidden>
        <div class="composer-copy">
          <h2 id="new-idea-title">What are you thinking about building?</h2>
          <p>A rough thought is enough. Groundwork will help you find the sharper version.</p>
        </div>
        <form id="new-idea-form" novalidate>
          <label class="sr-only" for="idea-input">Your initial idea</label>
          <textarea id="idea-input" rows="3" placeholder="For example: a simpler way for small clinics to follow up after appointments"></textarea>
          <p class="field-error" id="idea-input-error" hidden>Enter a starting thought before continuing.</p>
          <div class="starter-row" aria-label="Idea starters">
            <span>Try a starting point:</span>
            <button type="button" class="starter">A tool for...</button>
            <button type="button" class="starter">A service that...</button>
            <button type="button" class="starter">A better way to...</button>
          </div>
          <div class="composer-actions">
            <button class="secondary-button" id="cancel-idea-button" type="button">Cancel</button>
            <button class="primary-button" type="submit">Start shaping</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="ideas-list-title">
        <h2 class="sr-only" id="ideas-list-title">Saved ideas</h2>
        <div class="ideas-list" id="ideas-list" aria-live="polite"></div>
        <div class="page-state" id="page-state" hidden></div>
      </section>
    </main>

    <aside class="experiment-controls" aria-label="Prototype view">
      <label for="view-state">Prototype view</label>
      <select id="view-state">
        <option value="populated">Populated</option>
        <option value="loading">Loading</option>
        <option value="empty">Empty</option>
        <option value="error">Load error</option>
      </select>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
